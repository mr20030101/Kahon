<!--
  Kahon sign-up confirmation email.
  Paste into Supabase -> Authentication -> Emails -> Templates -> "Confirm signup" (Source).
  Subject: Confirm your Kahon account
  Replace https://YOUR-APP-URL with your deployed app URL (for the logo).
-->
<html><body style="margin:0;padding:24px 12px;background:#F4F8F5;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#13341F">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #D3E2D8;border-radius:12px">
      <tr><td style="padding:18px 24px;background:#13341F;border-radius:12px 12px 0 0">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="padding-right:10px"><img src="https://YOUR-APP-URL/icons/icon-192.png" width="28" height="28" alt="" style="display:block;border-radius:6px" /></td>
          <td style="color:#ffffff;font-size:18px;font-weight:800;letter-spacing:-0.3px">Kahon</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:26px 24px 8px">
        <h1 style="margin:0;font-size:20px;line-height:1.3;color:#13341F">Confirm your email</h1>
        <p style="margin:10px 0 0;font-size:15px;line-height:1.55;color:#4A6B56">Thanks for signing up for Kahon. Confirm this is your email address to finish creating your account.</p>
        <p style="margin:24px 0 0"><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:11px 18px;background:#15703C;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;border-radius:8px">Confirm email</a></p>
      </td></tr>
      <tr><td style="padding:22px 24px 22px;font-size:12px;line-height:1.5;color:#7A8F80">
        If you didn't sign up for Kahon, you can ignore this email.
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
